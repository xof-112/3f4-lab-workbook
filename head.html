<title>3F4-Lab Workbook</title>
<meta name="color-scheme" content="dark">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: Buch mit fester Inhaltsleiste links (Desktop), einspaltig auf dem Telefon.
   Signalfarben sind das Farbsystem: Audio blau, CV orange, Gate grün, Trigger magenta. */
:root{
  /* Farben: Aurora-Theme „Kante“ (dunkel, in beiden Farbschemata) */
  --bg:#1B1C1E; --surface:#232427; --surface2:#2A2B2E; --panel:#2E2F33;
  --ink:#C9CBD0; --muted:#8B8E95; --line:#303135;
  --audio:#4F9DB5; --cv:#D39B57; --gate:#6FB08A; --trig:#C77DA6;
  --audio-soft:#1C2D33; --cv-soft:#33291C; --gate-soft:#1D2B22; --trig-soft:#31202A;
  --warn:#D8C24A; --warn-soft:#2E2A16; color-scheme:dark;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0;
  padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--audio);text-underline-offset:2px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--audio);outline-offset:2px}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px}
@media (max-width:980px){.shell{grid-template-columns:minmax(0,1fr);gap:0}}
/* ---------- Inhaltsleiste ---------- */
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;padding:36px 0 24px}
.side details{border:0}
.side summary{list-style:none;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.side summary::-webkit-details-marker{display:none}
.side nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.side .grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.side a{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.02em;color:var(--ink);text-decoration:none;padding:3px 0 3px 10px;border-left:2px solid transparent;line-height:1.25}
.side a:hover{color:var(--audio)}
.side a.on{border-left-color:var(--cv);color:var(--cv)}
.side a.sub{font-size:14.5px;padding-left:22px;color:var(--muted)}
@media (max-width:980px){
  .side{position:static;max-height:none;padding:16px 0 0}
  .side details{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 14px}
}
@media (min-width:981px){.side summary{pointer-events:none}}
/* ---------- Haupttext ---------- */
main{min-width:0;max-width:780px;padding-top:36px}
.cover{padding:28px 0 36px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,8vw,78px);line-height:.92;overflow-wrap:break-word;hyphens:auto;letter-spacing:.005em;margin:0;text-transform:uppercase;text-wrap:balance}
.cover .lede{font-size:19px;color:var(--muted);max-width:60ch;margin:18px 0 0}
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
@media (max-width:640px){.bands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bands div{border-top:3px solid var(--ink);padding-top:8px}
.bands b{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
.bands span{font-family:var(--f-display);font-size:17px;line-height:1.15;display:block;margin-top:3px}
.part{margin-top:64px}
.part-h{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}
.part-h .pn{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--cv);text-transform:uppercase;flex:none}
.part-h h2{min-width:0;overflow-wrap:break-word;hyphens:auto}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;margin:44px 0 10px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h4{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.15;margin:28px 0 8px;letter-spacing:.02em;text-wrap:balance}
h3,h4,section,[id]{scroll-margin-top:16px}
p{margin:0 0 14px;max-width:68ch}
ul,ol{margin:0 0 14px;padding-left:22px;max-width:68ch}
li{margin:3px 0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.86em}
.jack{font-family:var(--f-mono);font-size:.8em;letter-spacing:.03em;padding:1px 5px;border:1px solid var(--line);border-radius:2px;background:var(--surface2);white-space:nowrap}
.bst{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cv);margin-bottom:4px}
.a{color:var(--audio);font-weight:600}.c{color:var(--cv);font-weight:600}.g{color:var(--gate);font-weight:600}.t{color:var(--trig);font-weight:600}
/* Marken */
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid;vertical-align:2px;white-space:nowrap}
.tag-h{color:var(--audio);border-color:var(--audio)}
.tag-p{color:var(--warn);border-color:var(--warn);border-style:dashed;background:var(--warn-soft)}
.tag-d{color:var(--muted);border-color:var(--line)}
.tag-ok{color:var(--gate);border-color:var(--gate)}
/* Kästen */
.box-c{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin:18px 0}
.box-c>*:last-child{margin-bottom:0}
.box-c h4{margin-top:0}
.goal{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 18px;margin:0}
.goal dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.goal dd{margin:0}
@media (max-width:560px){.goal{grid-template-columns:minmax(0,1fr);gap:2px}.goal dd{margin-bottom:10px}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:3px;background:var(--surface);margin:18px 0}
.facts div{padding:12px 14px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:none}
.facts b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.facts span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(2){border-right:none}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.warn{background:var(--warn-soft);border:1px solid var(--warn);border-left-width:4px;border-radius:3px;padding:14px 18px;margin:18px 0}
.warn>*:last-child{margin-bottom:0}
.warn strong:first-child{font-family:var(--f-display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--warn)}
.check{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:15.5px}
.check b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gate);margin-right:6px}
/* Tabellen */
.tbl{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
.tbl th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);text-align:left;background:var(--surface2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600}
.tbl.w table{min-width:620px}
/* Figuren */
figure{margin:22px 0;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px 16px 12px}
figure .sv{overflow-x:auto}
figure svg{display:block;width:100%;height:auto;min-width:560px}
figure.small svg{min-width:0}
figcaption{font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.45}
figcaption b{color:var(--ink);font-weight:600}
svg text{font-family:var(--f-mono);fill:var(--ink)}
.t-lab{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em}
.t-sub{font-size:11.5px;fill:var(--muted)}
.t-ax{font-size:11px;fill:var(--muted)}
.t-zero{stroke:var(--muted);stroke-width:1}
.t-grid{stroke:var(--line);stroke-width:1}
.sig{fill:none;stroke-width:2;stroke-linejoin:round}
.sig-audio{stroke:var(--audio)}.sig-cv{stroke:var(--cv)}.sig-gate{stroke:var(--gate)}.sig-trig{stroke:var(--trig)}
.sig-step{stroke:var(--audio);stroke-width:2}
.lab-cv{fill:var(--cv)}.lab-step{fill:var(--audio)}
.anno{stroke:var(--ink);stroke-width:2}
.box{fill:var(--surface2);stroke:var(--ink);stroke-width:1.2}
.box-strong{fill:var(--cv-soft);stroke:var(--cv);stroke-width:2}
.box-mod{fill:var(--cv-soft);stroke:var(--cv);stroke-width:1.2;stroke-dasharray:4 3}
.wire-audio{stroke:var(--audio);stroke-width:2.5}.wire-cv{stroke:var(--cv);stroke-width:2;stroke-dasharray:5 4}
.wire-ink{stroke:var(--ink);stroke-width:1.4}
.fill-audio{fill:var(--audio)}.fill-cv{fill:var(--cv)}.fill-ink{fill:var(--ink)}
.bar-mute{fill:var(--line)}.bar-lim{fill:var(--audio-soft);stroke:var(--audio);stroke-width:1}.bar-euro{fill:var(--cv)}
.mark-euro{stroke:var(--cv);stroke-width:1.5;stroke-dasharray:4 3}
.sec-a{fill:var(--surface2)}.sec-b{fill:var(--panel);opacity:.55}
/* Patchplan */
.pp .mod rect.m{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.pp .mod text.mt{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.03em}
.pp .mod text.ms{font-size:10.5px;fill:var(--muted)}
.pp .jk{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.pp .jk.o{fill:var(--ink)}
.pp .jl{font-size:10px}
.pp .cab{fill:none;stroke-width:4;stroke-linecap:round;transition:opacity .25s}
.pp .cab.audio{stroke:var(--audio)}.pp .cab.cv{stroke:var(--cv)}
.pp .badge circle{stroke:var(--surface);stroke-width:2}
.pp .badge.audio circle{fill:var(--audio)}.pp .badge.cv circle{fill:var(--cv)}
.pp .badge text{fill:var(--surface);font-size:12px;font-weight:500}
.pp .mod,.pp .cg{transition:opacity .25s}
.pp .off{opacity:.13}
@media (prefers-reduced-motion:reduce){.pp .cab,.pp .mod,.pp .cg{transition:none}}
.stages{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stages button{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;padding:6px 14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:2px;cursor:pointer}
.stages button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:22px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
/* Kabelliste */
.cables{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px;max-width:none}
.cables li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 14px;margin:0}
.cables .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--surface);margin-top:2px}
.cables .n.audio{background:var(--audio)}.cables .n.cv{background:var(--cv)}.cables .n.zero{background:var(--muted)}
.cables .r{min-width:0}
.cables .route{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.cables .route b{font-weight:500}
.cables .why{font-size:15px;color:var(--muted);margin-top:3px}
/* Regler */
.knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:4px 6px;margin:12px 0 4px}
.knob{width:100%;height:auto}
.knob .tick{stroke:var(--muted);stroke-width:1.3}
.knob .tick-c{stroke:var(--ink);stroke-width:2.2}
.knob .kn{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.knob .kp{stroke:var(--cv);stroke-width:3.2;stroke-linecap:round}
.knob .k-lab{font-family:var(--f-display);font-weight:600;font-size:14px}
.knob .k-sub{font-size:10.5px;fill:var(--muted)}
.mh{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 0;border-top:1px solid var(--line);padding-top:10px}
/* Spielplatz */
.play{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;margin:22px 0}
.play h4{margin:0 0 4px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px;margin:12px 0}
.ctrls label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctrls output{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);float:right;text-transform:none;letter-spacing:0}
.ctrls input[type=range]{width:100%;accent-color:var(--cv)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button,.btn{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:2px;cursor:pointer}
.presets button:hover,.btn:hover{border-color:var(--cv);color:var(--cv)}
.btn[aria-pressed="true"]{background:var(--cv);border-color:var(--cv);color:var(--surface)}
.play svg{display:block;width:100%;height:auto}
.play .hb{fill:var(--audio)}
.play .fc{fill:none;stroke:var(--cv);stroke-width:2}
.play .env{fill:none;stroke:var(--cv);stroke-width:1.6;stroke-dasharray:4 3}
.play .wave{fill:none;stroke:var(--audio);stroke-width:1.2}
.readout{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:6px}
/* Kapitel-Liste Band 1 */
.chap{border:1px solid var(--line);border-radius:3px;background:var(--surface);margin:8px 0}
.chap>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 16px}
.chap>summary::-webkit-details-marker{display:none}
.chap .cn{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--cv);font-variant-numeric:tabular-nums}
.chap .ct{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;display:block}
.chap .cs{font-size:14.5px;color:var(--muted);display:block;font-style:italic}
.chap .ph{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.chap>summary::after{content:"+";font-family:var(--f-mono);color:var(--cv);grid-column:3;grid-row:1}
.chap[open]>summary::after{content:"−"}
.chap .cb{padding:0 16px 14px 72px;font-size:15.5px}
@media (max-width:560px){.chap .cb{padding-left:16px}.chap .ph{display:none}}
.chap .cb p{margin-bottom:8px}
.chap.here{border-color:var(--cv);border-width:2px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;font-size:15px}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr)}}
/* Schablone */
.tpl{counter-reset:t -1;list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:3px;background:var(--surface);max-width:none}
.tpl li{counter-increment:t;padding:10px 14px 10px 50px;position:relative;border-bottom:1px solid var(--line);margin:0;font-size:15px}
.tpl li:nth-child(odd){border-right:1px solid var(--line)}
.tpl li::before{content:counter(t,decimal-leading-zero);position:absolute;left:14px;top:9px;font-family:var(--f-mono);font-size:12px;color:var(--cv)}
.tpl li b{font-family:var(--f-display);font-size:17px;font-weight:600;display:block;line-height:1.2}
.tpl li.new b::after{content:"neu";font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gate);border:1px solid var(--gate);padding:0 4px;border-radius:2px;margin-left:8px;vertical-align:3px}
@media (max-width:640px){.tpl{grid-template-columns:minmax(0,1fr)}.tpl li:nth-child(odd){border-right:none}}
/* Checkliste */
.todo{list-style:none;padding:0;max-width:none}
.todo li{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.todo input{margin-top:6px;width:16px;height:16px;accent-color:var(--gate);flex:none}
.todo label{cursor:pointer}
/* Fehlercheck */
.fault{display:grid;gap:10px;margin:14px 0}
.fault details{background:var(--surface);border:1px solid var(--line);border-radius:3px}
.fault summary{cursor:pointer;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:18px;list-style:none}
.fault summary::-webkit-details-marker{display:none}
.fault summary::before{content:"?";font-family:var(--f-mono);font-size:12px;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--trig);color:var(--surface);margin-right:10px;vertical-align:2px}
.fault ol{padding:0 18px 12px 46px;font-size:15.5px;margin:0}
/* Musterseiten */
.sample{border:2px solid var(--ink);border-radius:3px;background:var(--surface);padding:20px 22px;margin:22px 0}
.sample .sid{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--cv)}
.sample h3{margin-top:4px}
.sample h4{font-size:18px;margin-top:20px}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.refs div{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px;font-size:15px}
.refs b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.refs .id{font-family:var(--f-mono);font-size:12.5px;color:var(--cv)}
.src{font-size:14.5px}
.src li{margin:5px 0}
.back{display:inline-block;margin-top:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.back:hover{color:var(--audio)}
footer{margin-top:64px;border-top:1px solid var(--line);padding-top:16px;font-size:14px;color:var(--muted)}

/* Gate-Kabel */
.pp .cab.gate{stroke:var(--gate)}.pp .badge.gate circle{fill:var(--gate)}
.cables .n.gate{background:var(--gate)}
/* Inhaltsverzeichnis */
.tocgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 36px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:8px 20px 18px}
@media (max-width:700px){.tocgrid{grid-template-columns:minmax(0,1fr)}}
.tg{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cv);margin:16px 0 6px}
.tl{list-style:none;padding:0;margin:0;max-width:none}
