<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const $=id=>document.getElementById(id);
  const de=n=>n.toLocaleString("de-DE",{maximumFractionDigits:1});
  function el(tag,attrs,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}

  /* ---- Patchplan-Stufen (alle Kapitel) ---- */
  document.querySelectorAll(".stages[data-for]").forEach(grp=>{
    const box=$(grp.dataset.for), pp=box.querySelector(".pp"), cap=box.closest("figure").querySelector(".ppcap");
    grp.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const s=b.dataset.stage;
      grp.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      pp.querySelectorAll("[data-st]").forEach(g=>g.classList.toggle("off",!g.dataset.st.split(" ").includes(s)));
      const c=cap&&cap.getAttribute("data-cap-"+s); if(c) cap.innerHTML=c;
    }));
  });

  /* ---- Schwebung ---- */
  function drawBeat(){
    const d=parseFloat($("bdet").value), svg=$("beatSvg");
    svg.replaceChildren();
    const W=720,H=150,mid=75,A=30,T=2,car=60;
    svg.appendChild(el("line",{x1:0,y1:mid,x2:W,y2:mid,class:"t-grid"}));
    let p="",e1="",e2="";
    for(let i=0;i<=1400;i++){const t=i/1400*T,x=i/1400*W;
      const v=Math.sin(2*Math.PI*car*t)+Math.sin(2*Math.PI*(car+d)*t);
      p+=(i?"L":"M")+x.toFixed(1)+","+(mid-v*A).toFixed(1);
      const en=Math.abs(2*Math.cos(Math.PI*d*t));
      e1+=(i?"L":"M")+x.toFixed(1)+","+(mid-en*A).toFixed(1);
      e2+=(i?"L":"M")+x.toFixed(1)+","+(mid+en*A).toFixed(1);}
    svg.appendChild(el("path",{d:p,class:"wave"}));
    svg.appendChild(el("path",{d:e1,class:"env"}));svg.appendChild(el("path",{d:e2,class:"env"}));
    svg.appendChild(el("text",{x:0,y:H-4,class:"t-ax"},"0 s"));
    svg.appendChild(el("text",{x:W,y:H-4,class:"t-ax","text-anchor":"end"},"2 s"));
    $("bdetO").textContent=de(d)+" Hz";
    let msg = d===0 ? "Keine Verstimmung: beide Töne verschmelzen, die Summe ist einfach doppelt so laut." :
      d<0.4 ? `Sehr langsame Schwebung: ein Anschwellen alle ${de(1/d)} Sekunden. Kaum als Pulsieren zu hören, eher als langsames Wandern.` :
      d<=3 ? `${de(d)} ${d===1?'Schwebung':'Schwebungen'} pro Sekunde: das warme Pulsieren aus Kontrollpunkt 1C.` :
      d<=8 ? `${de(d)} Schwebungen pro Sekunde: deutliches Tremolo, unruhig.` : "";
    $("beatR").textContent=msg;
  }
  $("bdet").addEventListener("input",drawBeat); drawBeat();

  /* ---- Filter-Spielplatz ---- */
  const F0=110, FMIN=40, FMAX=12000;
  const fcHz=s=>60*Math.pow(12000/60,s);
  const qOf=s=>0.5+s*7.5;
  const clock=s=>{const h=7+s*10;const hh=Math.round(h*2)/2;let H=Math.floor(hh)>12?Math.floor(hh)-12:Math.floor(hh);return (hh%1? H+":30":H)+" Uhr";};
  function H2(f,fc,q){const r=f/fc;return 1/Math.sqrt((1-r*r)**2+(r/q)**2);}
  function drawFilt(){
    const s=parseFloat($("fc").value), qs=parseFloat($("fq").value), svg=$("filtSvg");
    const fc=fcHz(s), q=qOf(qs);
    svg.replaceChildren();
    const W=720,H=230,x0=40,x1=710,yTop=12,yBot=200,dbMax=18,dbMin=-48;
    const sx=f=>x0+(Math.log(f/FMIN)/Math.log(FMAX/FMIN))*(x1-x0);
    const sy=db=>yTop+(dbMax-Math.max(dbMin,Math.min(dbMax,db)))/(dbMax-dbMin)*(yBot-yTop);
    [100,1000,10000].forEach(f=>{svg.appendChild(el("line",{x1:sx(f),y1:yTop,x2:sx(f),y2:yBot,class:"t-grid"}));
      svg.appendChild(el("text",{x:sx(f),y:H-12,class:"t-ax","text-anchor":"middle"},f>=1000?(f/1000)+" kHz":f+" Hz"));});
    [0,-24,-48].forEach(db=>{svg.appendChild(el("line",{x1:x0,y1:sy(db),x2:x1,y2:sy(db),class:"t-grid"}));
      svg.appendChild(el("text",{x:x0-4,y:sy(db)+4,class:"t-ax","text-anchor":"end"},db+""));});
    svg.appendChild(el("text",{x:x0-4,y:yTop+8,class:"t-ax","text-anchor":"end"},"dB"));
    let pass=0;
    for(let n=1;F0*n<=FMAX;n++){const f=F0*n;const db=20*Math.log10((1/n)*H2(f,fc,q));
      if(db>-24)pass++;
      const y=sy(db);svg.appendChild(el("rect",{x:sx(f)-1.5,y:y,width:3,height:Math.max(0,yBot-y),class:"hb"}));}
    let d="";for(let i=0;i<=300;i++){const f=FMIN*Math.pow(FMAX/FMIN,i/300);d+=(i?"L":"M")+sx(f).toFixed(1)+","+sy(20*Math.log10(H2(f,fc,q))).toFixed(1);}
    svg.appendChild(el("path",{d:d,class:"fc"}));
    svg.appendChild(el("line",{x1:sx(fc),y1:yTop,x2:sx(fc),y2:yBot,class:"mark-euro"}));
    $("fcO").textContent=Math.round(fc)+" Hz · "+clock(s);
    $("fqO").textContent="Q "+de(q)+" · "+clock(qs);
    $("fdO").textContent=de(parseFloat($("fd").value))+" Hz";
    $("filtR").textContent=`${pass} Teiltöne lauter als −24 dB. `+(q>4?"Die Resonanzspitze hebt die Teiltöne um den Cutoff hervor.":pass>20?"Viele Obertöne: hell, nah, präsent.":pass<5?"Fast nur Grundton: dunkel, fern.":"");
    updAudio();
  }
  ["fc","fq","fd"].forEach(id=>$(id).addEventListener("input",drawFilt));
  const pre={A:[0.86,0.06],B:[0.16,0.06],C:[0.5,0.82]};
  document.querySelectorAll("#filt [data-p]").forEach(b=>b.addEventListener("click",()=>{const v=pre[b.dataset.p];$("fc").value=v[0];$("fq").value=v[1];drawFilt();}));

  /* ---- Audio (nur nach Klick) ---- */
  let ac=null,o1,o2,g2,lp,out;
  function updAudio(){ if(!ac)return; const t=ac.currentTime;
    lp.frequency.setTargetAtTime(fcHz(parseFloat($("fc").value)),t,0.03);
    lp.Q.setTargetAtTime(qOf(parseFloat($("fq").value)),t,0.03);
    const d=parseFloat($("fd").value); o2.frequency.setTargetAtTime(F0+d,t,0.03); g2.gain.setTargetAtTime(d>0?1:0,t,0.05);}
  $("aud").addEventListener("click",()=>{
    const b=$("aud");
    if(ac){ out.gain.setTargetAtTime(0,ac.currentTime,0.05); const c=ac; ac=null; setTimeout(()=>c.close(),300); b.setAttribute("aria-pressed","false"); b.textContent="Anhören"; return; }
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      o1=ac.createOscillator();o1.type="sawtooth";o1.frequency.value=F0;
      o2=ac.createOscillator();o2.type="sawtooth";o2.frequency.value=F0;
      g2=ac.createGain();g2.gain.value=0;
      lp=ac.createBiquadFilter();lp.type="lowpass";
      out=ac.createGain();out.gain.value=0;
      o1.connect(lp);o2.connect(g2).connect(lp);lp.connect(out).connect(ac.destination);
      o1.start();o2.start(); updAudio(); out.gain.setTargetAtTime(0.07,ac.currentTime,0.1);
      b.setAttribute("aria-pressed","true"); b.textContent="Stopp";
    }catch(e){ac=null;b.textContent="Audio nicht verfügbar";}
  });
  drawFilt();


  /* ---- Wavefolder-Spielplatz ---- */
  const foldF=x=>{while(Math.abs(x)>1){x=(x>0?2:-2)-x;}return x;};
  function drawFold(){
    const g=parseFloat($("fg").value), bias=parseFloat($("fb").value), svg=$("foldSvg");
    svg.replaceChildren();
    const N=512, sm=[];
    for(let i=0;i<N;i++)sm.push(foldF(g*Math.sin(2*Math.PI*i/N)+bias));
    // Welle (2 Perioden) links
    const wx0=10,ww=330,mid=95,A=70;
    svg.appendChild(el("line",{x1:wx0,y1:mid,x2:wx0+ww,y2:mid,class:"t-grid"}));
    let d="";for(let k=0;k<=400;k++){const v=sm[Math.floor(k/400*2*N)%N];d+=(k?"L":"M")+(wx0+k/400*ww).toFixed(1)+","+(mid-v*A).toFixed(1);}
    svg.appendChild(el("path",{d:d,class:"wave",style:"stroke-width:2"}));
    // Spektrum rechts
    const sx0=380,sw=330,base=170,mags=[];
    for(let n=1;n<=24;n++){let re=0,im=0;for(let i=0;i<N;i++){const a=2*Math.PI*n*i/N;re+=sm[i]*Math.cos(a);im-=sm[i]*Math.sin(a);}mags.push(2*Math.hypot(re,im)/N);}
    const mx=Math.max(...mags,1e-9);let cnt=0;
    mags.forEach((m,i)=>{const db=20*Math.log10(m/mx);const h=Math.max(0,(db+48)/48*140);if(db>-30)cnt++;
      svg.appendChild(el("rect",{x:sx0+i*13.5,y:base-h,width:8,height:h,class:"hb"}));});
    svg.appendChild(el("line",{x1:sx0,y1:base,x2:sx0+sw,y2:base,class:"t-grid"}));
    svg.appendChild(el("text",{x:sx0,y:base+16,class:"t-ax"},"1"));
    svg.appendChild(el("text",{x:sx0+23*13.5,y:base+16,class:"t-ax"},"24"));
    svg.appendChild(el("text",{x:sx0+sw,y:14,class:"t-ax","text-anchor":"end"},"Obertöne 1–24"));
    svg.appendChild(el("text",{x:wx0,y:190,class:"t-ax"},"zwei Perioden"));
    $("fgO").textContent="× "+de(g); $("fbO").textContent=de(bias);
    $("foldR").textContent=`${cnt} Obertöne stärker als −30 dB relativ zum lautesten. `+(Math.abs(bias)>0.05?"Mit Asymmetrie kommen gerade Obertöne dazu.":"Symmetrisch: nur ungerade Obertöne.");
    updFoldAud();
  }
  let fac=null,fos,fws;
  function foldCurve(){const g=parseFloat($("fg").value),b=parseFloat($("fb").value),n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=foldF(g*x+b)*0.9;}return c;}
  function updFoldAud(){if(fac)fws.curve=foldCurve();}
  $("foldAud").addEventListener("click",()=>{const b=$("foldAud");
    if(fac){const c=fac;fac=null;c.close();b.setAttribute("aria-pressed","false");b.textContent="Anhören";return;}
    try{fac=new (window.AudioContext||window.webkitAudioContext)();fos=fac.createOscillator();fos.frequency.value=110;fws=fac.createWaveShaper();fws.curve=foldCurve();
      const g=fac.createGain();g.gain.value=0;fos.connect(fws).connect(g).connect(fac.destination);fos.start();g.gain.setTargetAtTime(0.07,fac.currentTime,0.1);
      b.setAttribute("aria-pressed","true");b.textContent="Stopp";}catch(e){fac=null;b.textContent="Audio nicht verfügbar";}
  });
  ["fg","fb"].forEach(id=>$(id).addEventListener("input",drawFold)); drawFold();

  /* ---- FM-Spielplatz ---- */
  function besselJ(n,x){let s=0;for(let k=0;k<40;k++){let t=Math.pow(-1,k)*Math.pow(x/2,2*k+n);let f1=1,f2=1;for(let i=2;i<=k;i++)f1*=i;for(let i=2;i<=n+k;i++)f2*=i;t/=f1*f2;s+=t;if(Math.abs(t)<1e-12&&k>n)break;}return s;}
  const FC=220;
  function drawFM(){
    const r=parseFloat($("fr").value), I=parseFloat($("fi").value), svg=$("fmSvg");
    svg.replaceChildren();
    const fm=FC*r, x0=30,x1=710,base=160,fmax=2500, sx=f=>x0+f/fmax*(x1-x0);
    const lines=new Map();
    for(let n=-20;n<=20;n++){let f=FC+n*fm;const a=Math.abs(besselJ(Math.abs(n),I));if(a<0.01)continue;f=Math.abs(f);if(f>fmax)continue;const k=f.toFixed(1);lines.set(k,(lines.get(k)||0)+a);}
    [0,500,1000,1500,2000,2500].forEach(f=>{svg.appendChild(el("line",{x1:sx(f),y1:20,x2:sx(f),y2:base,class:"t-grid"}));svg.appendChild(el("text",{x:sx(f),y:base+16,class:"t-ax","text-anchor":"middle"},f+" Hz"));});
    let harm=true;
    lines.forEach((a,k)=>{const f=parseFloat(k);const h=Math.min(1,a)*130;svg.appendChild(el("rect",{x:sx(f)-2,y:base-h,width:4,height:h,class:"hb"}));
      const q=f/FC; if(f>1&&Math.abs(q*2-Math.round(q*2))>0.02)harm=false;});
    svg.appendChild(el("line",{x1:sx(FC),y1:14,x2:sx(FC),y2:base,class:"mark-euro"}));
    svg.appendChild(el("text",{x:sx(FC)+4,y:22,class:"t-ax"},"Träger"));
    $("frO").textContent=de(r)+" : 1"; $("fiO").textContent=de(I);
    $("fmR").textContent=`Modulator ${Math.round(fm)} Hz · ${lines.size} Teiltöne sichtbar · `+(harm?"harmonisch":"unharmonisch, glockig");
    updFmAud();
  }
  let mac=null,car,mod,mg;
  function updFmAud(){if(!mac)return;const r=parseFloat($("fr").value),I=parseFloat($("fi").value),t=mac.currentTime;mod.frequency.setTargetAtTime(FC*r,t,0.03);mg.gain.setTargetAtTime(I*FC*r,t,0.03);}
  $("fmAud").addEventListener("click",()=>{const b=$("fmAud");
    if(mac){const c=mac;mac=null;c.close();b.setAttribute("aria-pressed","false");b.textContent="Anhören";return;}
    try{mac=new (window.AudioContext||window.webkitAudioContext)();car=mac.createOscillator();car.frequency.value=FC;mod=mac.createOscillator();mg=mac.createGain();
      mod.connect(mg).connect(car.frequency);const g=mac.createGain();g.gain.value=0;car.connect(g).connect(mac.destination);car.start();mod.start();updFmAud();g.gain.setTargetAtTime(0.06,mac.currentTime,0.1);
      b.setAttribute("aria-pressed","true");b.textContent="Stopp";}catch(e){mac=null;b.textContent="Audio nicht verfügbar";}
  });
  document.querySelectorAll("#fmplay [data-fm]").forEach(b=>b.addEventListener("click",()=>{const [r,i]=b.dataset.fm.split(",");$("fr").value=r;$("fi").value=i;drawFM();}));
  ["fr","fi"].forEach(id=>$(id).addEventListener("input",drawFM)); drawFM();


  /* ---- Leo-Leo-Simulator ---- */
  (function(){
    const G=$("leoGrid"); if(!G)return;
    const K=[[0,3,7,10],[12,11,8,5],[2,5,7,14],[6,4,3,1]].map(r=>r.map(v=>v/12));
    const st={s:0,r:0,R:["play","play","play","play"],L:["play","play","play","play"],M:[false,false,false,false],half:false,g1down:false,hist:[],gates:[0,0,0,0,0,0]};
    const NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","H"];
    const note=v=>{const n=Math.round(v*12);return NN[n%12]+(3+Math.floor(n/12));};
    const lab={play:"PLAY",skip:"SKIP",stop:"STOP"}, nxt={play:"skip",skip:"stop",stop:"play"};
    const cells=[];
    G.appendChild(el2("div","lh",""));for(let c=0;c<4;c++)G.appendChild(el2("div","lh",String(c+1)));
    for(let r=0;r<4;r++){G.appendChild(el2("div","lh","ABCD"[r]));cells[r]=[];
      for(let c=0;c<4;c++){const d=el2("div","cell","");const i=document.createElement("input");i.type="range";i.min=0;i.max=2;i.step=1/12;i.value=K[r][c];i.id=`leo${r}${c}`;i.setAttribute("aria-label",`Regler ${"ABCD"[r]}${c+1}`);
        const sp=document.createElement("span");i.addEventListener("input",()=>{K[r][c]=parseFloat(i.value);render();});d.append(i,sp);G.appendChild(d);cells[r][c]={d,sp};}}
    const rows=[["→","R"],["←","L"],["MUTE","M"]];const btns={R:[],L:[],M:[]};
    rows.forEach(([t,k])=>{G.appendChild(el2("div","lh",t));for(let c=0;c<4;c++){const b=document.createElement("button");b.type="button";
      b.addEventListener("click",()=>{if(k==="M")st.M[c]=!st.M[c];else st[k][c]=nxt[st[k][c]];render();});btns[k].push(b);G.appendChild(b);}});
    function el2(t,c,x){const e=document.createElement(t);e.className=c;e.textContent=x;return e;}
    let ac=null;
    function pluck(v){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type="sawtooth";o.frequency.value=130.81*Math.pow(2,Math.round(v*12)/12);
      f.type="lowpass";f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(300,t+0.25);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.08,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.connect(f).connect(g).connect(ac.destination);o.start(t);o.stop(t+0.35);}
    function flash(i){st.gates[i]=Date.now();}
    function enter(n,trig){st.s=n;const m=st.M[n];
      if(!m){flash(n);if(!trig)flash(4);}
      flash(5);
      if(st.g1down&&n===0&&!m)down();
      const v=K[st.r][st.s];st.hist.push(v);if(st.hist.length>32)st.hist.shift();
      if(!m)pluck(v);render();}
    function step(dir){const rules=dir>0?st.R:st.L;if(rules[st.s]==="stop"){render("STOP hält den Ball auf Stufe "+(st.s+1)+".");return;}
      let n=(st.s+dir+4)%4,g=0;while(rules[n]==="skip"&&g<4){n=(n+dir+4)%4;g++;}if(g>=4)return;enter(n,false);}
    function down(){st.r=st.half?(st.r+1)%2:(st.r+1)%4;}
    function render(msg){
      for(let r=0;r<4;r++)for(let c=0;c<4;c++){const x=cells[r][c];x.d.classList.toggle("col",c===st.s);x.d.classList.toggle("cur",c===st.s&&r===st.r);x.sp.textContent=note(K[r][c]);}
      for(let c=0;c<4;c++){btns.R[c].textContent=lab[st.R[c]];btns.R[c].className="r-"+st.R[c];btns.L[c].textContent=lab[st.L[c]];btns.L[c].className="r-"+st.L[c];btns.M[c].textContent=st.M[c]?"STUMM":"–";btns.M[c].className=st.M[c]?"muted":"";}
      const now=Date.now(),led=i=>`<span class="leo-led${now-st.gates[i]<160?" on":""}"></span>`;
      const A=K[st.r][st.s],D=K[3-st.r][st.s];
      $("leoOut").innerHTML=["A","B","C","D"].map((z,i)=>`<div><b>ROW ${z}</b> ${de(K[i][st.s])} V</div>`).join("")+
        `<div><b>ABCD</b> ${de(A)} V · ${note(A)}</div><div><b>DCBA</b> ${de(D)} V · ${note(D)}</div>`+
        `<div>${led(0)}${led(1)}${led(2)}${led(3)}<b>GATE 1–4</b></div><div>${led(4)}<b>ALL</b> ${led(5)}<b>COMMON</b></div>`;
      const svg=$("leoHist");svg.replaceChildren();const W=720,H=110,n=32;
      svg.appendChild(el("line",{x1:0,y1:H-10,x2:W,y2:H-10,class:"t-grid"}));
      let d="";st.hist.forEach((v,i)=>{const x0=i*W/n,x1=(i+1)*W/n,y=H-10-v/2*(H-25);d+=(i?"L":"M")+x0.toFixed(1)+","+y.toFixed(1)+"L"+x1.toFixed(1)+","+y.toFixed(1);});
      if(d)svg.appendChild(el("path",{d:d,class:"sig sig-audio"}));
      svg.appendChild(el("text",{x:W,y:12,class:"t-ax","text-anchor":"end"},"ABCD, letzte 32 Schritte"));
      $("leoR").textContent=msg||`Stufe ${st.s+1} · Zeile ${"ABCD"[st.r]}${st.half?" · 2 × 8":st.g1down?" · 1 × 16":" · 4 × 4"}. Im Simulator reichen die Regler nur über 2 V (zwei Oktaven), am Modul über etwa 10 V.`;
    }
    document.querySelectorAll("#leosim [data-leo]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.leo;
      if(a==="right")step(1);else if(a==="left")step(-1);else if(a==="down"){down();render();}else{st.r=0;render();}}));
    for(let c=0;c<4;c++){}
    let timer=null;
    $("leoRun").addEventListener("click",()=>{const b=$("leoRun");if(timer){clearInterval(timer);timer=null;b.setAttribute("aria-pressed","false");}else{timer=setInterval(()=>step(1),300);b.setAttribute("aria-pressed","true");}});
    $("leoDown4").addEventListener("click",()=>{st.g1down=!st.g1down;$("leoDown4").setAttribute("aria-pressed",String(st.g1down));render();});
    $("leoHalf").addEventListener("click",()=>{st.half=!st.half;if(st.half&&st.r>1)st.r=0;$("leoHalf").setAttribute("aria-pressed",String(st.half));render();});
    $("leoSnd").addEventListener("click",()=>{const b=$("leoSnd");if(ac){ac.close();ac=null;b.setAttribute("aria-pressed","false");b.textContent="Ton an";return;}
      try{ac=new (window.AudioContext||window.webkitAudioContext)();b.setAttribute("aria-pressed","true");b.textContent="Ton aus";}catch(e){b.textContent="Audio nicht verfügbar";}});
    setInterval(()=>{if(Date.now()-Math.max(...st.gates)<400)render();},80);
    render();
  })();

  /* ---- Hüllkurven-Spielplatz (Kap. 03) ---- */
  (function(){
    if(!$("envplay"))return;
    const st={mode:"adsr",segExp:true,vcaExp:false};
    const tA=v=>0.001*Math.pow(2000,v), tDR=v=>0.005*Math.pow(800,v);
    const fmt=s=>s<1?Math.round(s*1000)+" ms":de(s)+" s";
    const P=()=>({A:tA(+$("ea").value),D:tDR(+$("ed").value),S:+$("es").value,R:tDR(+$("er").value),G:+$("eg").value});
    const curve=(x,from,to,att)=>{ if(!st.segExp) return from+(to-from)*x;
      const k=att?3:5, n=(1-Math.exp(-k*x))/(1-Math.exp(-k)); return from+(to-from)*n; };
    function build(){
      const p=P(), m=st.mode, pts=[]; let T;

      LS.set("wb-read-marks",marks); }
    function markIndex(b,items){const m=marks[b.id]; if(!m)return 0;
      let best=-1,d=1e9; items.forEach((it,i)=>{if(it.text.slice(0,60)===m.t&&Math.abs(i-m.i)<d){d=Math.abs(i-m.i);best=i;}});
      return best>=0?best:Math.min(m.i,items.length-1);}
    function inView(el){const r=el.getBoundingClientRect();return r.bottom>70&&r.top<innerHeight-90;}
    function hilite(){
      document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
      const it=nowItem(); if(!it)return; it.el.classList.add("reading");
      if(cur.away&&inView(it.el))cur.away=false;
      if(follow&&!cur.away&&!inView(it.el)){try{it.el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}}
      ui();
    }
    function speakLoop(g){
      if(g!==gen||!cur||cur.state!=="play")return;
      if(cur.idx>=cur.items.length){finish();return;}
      const it=cur.items[cur.idx];
      if(!cur.parts){cur.parts=chunks(say(it.text));hilite();}
      if(cur.j>=cur.parts.length){cur.idx++;cur.j=0;cur.parts=null;saveMark();speakLoop(g);return;}
      const u=new SpeechSynthesisUtterance(cur.parts[cur.j]); u.lang="de-DE"; if(voice)u.voice=voice; u.rate=rate;
      u.onend=()=>{if(g!==gen)return;cur.j++;speakLoop(g);};
      u.onerror=e=>{if(g!==gen||e.error==="interrupted"||e.error==="canceled")return;cur.j++;speakLoop(g);};
      synth.speak(u);
    }
    function play(){ if(!cur)return; const g=++gen, busy=synth.speaking||synth.pending; synth.cancel(); cur.state="play"; hilite();
      /* Safari (iOS) will den ersten Start direkt im Tipp; nach cancel() braucht Chrome eine kurze Pause */
      if(busy)setTimeout(()=>speakLoop(g),80); else speakLoop(g); }
    function pause(){ if(!cur)return; gen++; synth.cancel(); cur.state="pause"; saveMark(); ui(); }
    function stop(){ gen++; synth.cancel(); if(cur){saveMark(); cur.B.root.removeAttribute("data-rd-active"); cur.items.forEach(it=>it.el.classList.remove("rd-item"));}
      document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading")); cur=null; ui(); }
    function finish(){ const b=cur&&cur.B; stop(); if(b){delete marks[b.id];LS.set("wb-read-marks",marks);ui();setStatus(b,"fertig");} }
    function start(b,from){ stop(); const items=collect(b.root); if(!items.length){setStatus(b,"kein Vorlesetext");return;}
      cur={B:b,items,idx:Math.max(0,Math.min(from,items.length-1)),j:0,parts:null,state:"play",away:false};
      b.root.setAttribute("data-rd-active",""); items.forEach(it=>it.el.classList.add("rd-item")); play(); }
    function jump(i,andPlay){ if(!cur)return; cur.idx=Math.max(0,Math.min(i,cur.items.length-1)); cur.j=0; cur.parts=null; cur.away=false;
      if(andPlay||cur.state==="play")play(); else {saveMark();hilite();} }
    function rebuild(){ if(!cur)return; const old=nowItem(), wasPlay=cur.state==="play";
      cur.items.forEach(it=>it.el.classList.remove("rd-item")); const items=collect(cur.B.root);
      let i=old?items.findIndex(it=>it.el===old.el):0;
      if(i<0&&old)i=items.findIndex(it=>old.el.compareDocumentPosition(it.el)&Node.DOCUMENT_POSITION_FOLLOWING);
      if(i<0)i=items.length-1; cur.items=items; items.forEach(it=>it.el.classList.add("rd-item"));
      const same=old&&items[i]&&items[i].el===old.el; cur.idx=Math.max(0,i);
      if(!same){cur.j=0;cur.parts=null;}
      if(wasPlay&&!same)play(); else hilite(); }
    function fromHere(b){ const items=collect(b.root); const y=innerHeight*0.18;
      let i=items.findIndex(it=>it.el.getBoundingClientRect().bottom>y); start(b,i<0?0:i); }

    /* -- Leisten am Abschnittskopf ausbauen -- */
    function setStatus(b,t){const s=b.bar.querySelector(".rs");if(s)s.textContent=t;}
    function optBox(){return '<details class="rd-opt"><summary title="Was beim Vorlesen ausgelassen wird">Optionen</summary><div class="rd-optbox">'+
      '<span class="rd-oh">Mitlesen</span>'+OPTS.map(o=>`<label><input type="checkbox" data-o="${o[0]}"> ${o[1]}</label>`).join("")+
      '<span class="rd-oh">Verhalten</span><label><input type="checkbox" data-o="follow"> Seite scrollt mit</label>'+
      '<label><input type="checkbox" data-o="dock"> Leiste „Ab hier“ unten einblenden</label>'+
      '<button type="button" class="rd-clear">Alle Lesemarken löschen</button></div></details>';}
    B.forEach(b=>{
      const bar=b.bar; bar.hidden=false;
      const play_=bar.querySelector(".rd-play"), stop_=bar.querySelector(".rd-stop"), rsel=bar.querySelector(".rd-rate");
      const rew=document.createElement("button"); rew.type="button"; rew.className="rd-rew"; rew.textContent="↺ Von vorn"; rew.title="Abschnitt von Anfang an vorlesen";
      play_.after(rew);
      const heads=[...b.root.querySelectorAll("h3,h4")].filter(h=>h.closest(SECT)===b.root&&!h.closest(SKIP));
      if(heads.length){const sel=document.createElement("select"); sel.className="rd-jump"; sel.setAttribute("aria-label","Vorlesen ab Überschrift");
        sel.innerHTML='<option value="">Start bei …</option>'+heads.map((h,i)=>`<option value="${i}">${h.textContent.replace(/\s+/g," ").trim().slice(0,70).replace(/</g,"&lt;")}</option>`).join("");
        sel.addEventListener("change",()=>{const h=heads[+sel.value]; sel.value=""; if(!h)return;
          const items=collect(b.root); let i=items.findIndex(it=>it.el===h);
          if(i<0)i=items.findIndex(it=>h.compareDocumentPosition(it.el)&Node.DOCUMENT_POSITION_FOLLOWING); start(b,Math.max(0,i));});
        rew.after(sel);}
      rsel.innerHTML=RATES; rsel.value=String(rate);
      stop_.insertAdjacentHTML("afterend",optBox());
      play_.addEventListener("click",()=>{
        if(cur&&cur.B===b){cur.state==="play"?pause():play();return;}
        const items=collect(b.root); start(b,markIndex(b,items));
      });
      rew.addEventListener("click",()=>{delete marks[b.id];LS.set("wb-read-marks",marks);start(b,0);});
      stop_.addEventListener("click",()=>{ if(cur&&cur.B===b)stop(); });
    });

    /* -- Optionen, Tempo: gelten überall -- */
    function syncOpts(){document.querySelectorAll(".rd-opt input[data-o]").forEach(i=>{const k=i.dataset.o;i.checked=k==="follow"?follow:k==="dock"?dockOn:!!opt[k];});
      document.querySelectorAll(".rd-rate").forEach(s=>s.value=String(rate));}
    document.addEventListener("change",e=>{const t=e.target;
      if(t.matches(".rd-opt input[data-o]")){const k=t.dataset.o;
        if(k==="follow"){follow=t.checked;LS.set("wb-read-follow",follow);}
        else if(k==="dock"){dockOn=t.checked;LS.set("wb-read-dock",dockOn);dockPos();}
        else{opt[k]=t.checked;LS.set("wb-read-opts",opt);rebuild();}
        syncOpts();}
      else if(t.matches(".rd-rate")){rate=parseFloat(t.value)||1;LS.set("wb-read-rate",rate);syncOpts();if(cur&&cur.state==="play")play();}
    });
    document.addEventListener("click",e=>{if(e.target.matches(".rd-clear")){Object.keys(marks).forEach(k=>delete marks[k]);LS.set("wb-read-marks",marks);ui();}});
    syncOpts();

    /* -- Schwebende Leiste -- */
    const D=document.createElement("div"); D.className="rd-dock"; D.id="rdDock"; D.hidden=true; D.setAttribute("role","region"); D.setAttribute("aria-label","Vorlesen");
    D.innerHTML='<span class="rd-idle"><button type="button" data-a="here" title="Ab dem ersten sichtbaren Absatz vorlesen">▶ Ab hier vorlesen</button>'+
      '<button type="button" data-a="mark" title="Bei der Lesemarke dieses Abschnitts weiterlesen">↪ Lesemarke</button>'+
      '<button type="button" data-a="hide" class="rd-x" title="Leiste ausblenden (wieder einschalten unter Optionen)" aria-label="Leiste ausblenden">×</button></span>'+
      '<span class="rd-act"><span class="rd-where" aria-live="polite"></span>'+
      '<button type="button" data-a="prev" title="Absatz zurück" aria-label="Absatz zurück">⏮</button>'+
      '<button type="button" data-a="toggle" class="on" aria-label="Pause">❚❚</button>'+
      '<button type="button" data-a="next" title="Absatz vor" aria-label="Absatz vor">⏭</button>'+
      '<button type="button" data-a="find" title="Zur vorgelesenen Stelle" aria-label="Zur Stelle">◎</button>'+
      '<button type="button" data-a="stop" title="Stopp (Lesemarke bleibt)" aria-label="Stopp">■</button>'+
      '<select class="rd-rate" aria-label="Tempo">'+RATES+'</select></span>';
    document.body.appendChild(D); syncOpts();
    let viewB=null;
    D.addEventListener("click",e=>{const a=e.target.closest("[data-a]"); if(!a)return; const k=a.dataset.a;
      if(k==="here"&&viewB)fromHere(viewB);
      else if(k==="mark"&&viewB)start(viewB,markIndex(viewB,collect(viewB.root)));
      else if(k==="hide"){dockOn=false;LS.set("wb-read-dock",false);syncOpts();dockPos();}
      else if(!cur)return;
      else if(k==="toggle")cur.state==="play"?pause():play();
      else if(k==="prev")jump(cur.j>0&&cur.state==="play"?cur.idx:cur.idx-1);
      else if(k==="next")jump(cur.idx+1);
      else if(k==="find"){cur.away=false;const it=nowItem();if(it)try{it.el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}}
      else if(k==="stop")stop();
    });
    function sectionInView(){ const y=innerHeight*0.4; let best=null,h=1e12;
      for(const b of B){const r=b.root.getBoundingClientRect(); if(r.top<=y&&r.bottom>=y&&r.height<h){h=r.height;best=b;}} return best; }
    function dockPos(){
      if(cur){D.hidden=false;D.classList.add("active");return;}
      D.classList.remove("active");
      viewB=dockOn?sectionInView():null;
      const show=!!viewB&&!inView(viewB.bar);
      D.hidden=!show; if(show)D.querySelector('[data-a="mark"]').hidden=!marks[viewB.id];
    }
    let raf=0; addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;dockPos();});},{passive:true});
    ["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>{if(cur&&cur.state==="play")cur.away=true;},{passive:true}));

    function ui(){
      B.forEach(b=>{const p=b.bar.querySelector(".rd-play"), rew=b.bar.querySelector(".rd-rew"), m=marks[b.id];
        if(cur&&cur.B===b){p.classList.toggle("on",cur.state==="play");p.textContent=cur.state==="play"?"❚❚ Pause":"▶ Weiter";rew.hidden=false;
          setStatus(b,(cur.state==="play"?"liest":"pausiert")+" · "+(Math.min(cur.idx+1,cur.items.length))+"/"+cur.items.length);}
        else{p.classList.remove("on");p.textContent=m?"▶ Weiter":"▶ Vorlesen";rew.hidden=!m;
          p.title=m?"Bei der Lesemarke weiterlesen (Absatz "+(m.i+1)+" von "+m.n+")":"Abschnitt vorlesen";
          setStatus(b,m?"Lesemarke "+(m.i+1)+"/"+m.n:"");}
      });
      if(cur){const t=D.querySelector('[data-a="toggle"]');t.textContent=cur.state==="play"?"❚❚":"▶";t.classList.toggle("on",cur.state==="play");
        t.setAttribute("aria-label",cur.state==="play"?"Pause":"Weiter");
        D.querySelector(".rd-where").textContent=(cur.B.title.slice(0,34))+" · "+Math.min(cur.idx+1,cur.items.length)+"/"+cur.items.length+(cur.state==="pause"?" · pausiert":"");}
      dockPos();
    }

    /* -- Klick auf einen Absatz: dort weiterlesen (nur solange Vorlesen läuft oder pausiert ist) -- */
    document.addEventListener("click",e=>{
      if(!cur||e.defaultPrevented||!cur.B.root.contains(e.target))return;
      if(e.target.closest("a,button,input,select,textarea,label,summary,.reader,.rd-dock,svg,.play,.knobs"))return;
      const s=getSelection&&getSelection(); if(s&&String(s).length>2)return;
      const i=cur.items.findIndex(it=>it.el.contains(e.target)); if(i>=0)jump(i,true);
    });
    document.addEventListener("toggle",e=>{if(cur&&e.target.matches&&e.target.matches("details")&&cur.B.root.contains(e.target)&&!e.target.closest(".reader"))rebuild();},true);
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur&&!e.target.closest("input,select,textarea"))pause();});
    addEventListener("pagehide",()=>{saveMark();synth.cancel();});
    ui();
  })();

  /* ---- Checkliste merken ---- */
  document.querySelectorAll(".todo input").forEach(cb=>{
    try{cb.checked=localStorage.getItem("wb-"+cb.id)==="1";}catch(e){}
    cb.addEventListener("change",()=>{try{localStorage.setItem("wb-"+cb.id,cb.checked?"1":"0");}catch(e){}});
  });

  /* ---- Teil VI · Prüfliste (localStorage „wb-pruef“) ---- */
  (function(){
    const box=$("teil6"); if(!box)return;
    const cbs=[...box.querySelectorAll("input[data-pr]")]; let S={};
    try{S=JSON.parse(localStorage.getItem("wb-pruef")||"{}")||{};}catch(e){S={};}
    let hide=false; try{hide=localStorage.getItem("wb-pruef-hide")==="1";}catch(e){}
    const save=()=>{try{localStorage.setItem("wb-pruef",JSON.stringify(S));localStorage.setItem("wb-pruef-hide",hide?"1":"0");}catch(e){}};
    const show=()=>{let n=0;cbs.forEach(cb=>{const on=!!S[cb.dataset.pr];cb.checked=on;if(on)n++;const li=cb.closest("li");li.classList.toggle("done",on);li.hidden=hide&&on;});
      $("prCount").textContent=n+" von "+cbs.length+" abgehakt";$("prHide").checked=hide;};
    cbs.forEach(cb=>cb.addEventListener("change",()=>{if(cb.checked)S[cb.dataset.pr]=1;else delete S[cb.dataset.pr];save();show();}));
    $("prHide").addEventListener("change",e=>{hide=e.target.checked;save();show();});
    $("prReset").addEventListener("click",()=>{S={};save();show();});
    $("prText").addEventListener("click",()=>{const o=$("prOut");if(!o.hidden){o.hidden=true;return;}const L=[];let h="";
      box.querySelectorAll("h4.pr-h, ol.pruef li").forEach(e=>{if(e.matches("h4")){h=e.textContent.trim();return;}const cb=e.querySelector("input");if(S[cb.dataset.pr])return;if(h){L.push("","## "+h);h="";}L.push("- [ ] "+e.querySelector("label span").textContent.trim());});
      o.textContent=L.join("\n").trim();o.hidden=false;});
    show();
  })();

  /* ---- Inhaltsleiste: aktiver Abschnitt, Telefon zugeklappt ---- */
  if(window.matchMedia("(max-width:980px)").matches) $("tocbox").removeAttribute("open");
  const links=[...document.querySelectorAll(".side nav a")];
  const targets=links.map(a=>document.querySelector(a.getAttribute("href"))).filter(Boolean);
  if("IntersectionObserver" in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id));}});},{rootMargin:"0px 0px -75% 0px"});
    targets.forEach(t=>io.observe(t));
  }
  links.forEach(a=>a.addEventListener("click",()=>{if(window.matchMedia("(max-width:980px)").matches)$("tocbox").removeAttribute("open");}));
})();
</script>
